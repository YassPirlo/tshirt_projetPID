spring.application.name=demo

# Configuration utilisée uniquement par les tests (./mvnw test).
# Elle remplace src/main/resources/application.properties : les tests
# utilisent une base H2 en mémoire, en mode compatible MySQL, au lieu de
# MAMP ou XAMPP. Ils tournent donc sur n'importe quel ordinateur.
spring.datasource.url=jdbc:h2:mem:tshirt_shop;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crée les tables à partir des entités au début des tests
# et les supprime à la fin
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
