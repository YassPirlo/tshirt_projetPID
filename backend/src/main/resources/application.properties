spring.application.name=demo

# Connexion MySQL
# Port par defaut : 3306 (XAMPP). MAMP utilise 8889 : soit changer le port
# dans MAMP > Preferences > Ports, soit lancer avec DB_PORT=8889 ./mvnw spring-boot:run
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/tshirt_shop
spring.datasource.username=tshirt_user
spring.datasource.password=tshirt123

# Hibernate verifie que les entites correspondent aux tables, sans les modifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
